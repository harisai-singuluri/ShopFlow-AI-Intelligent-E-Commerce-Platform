# Application configuration for ShopFlow
# Use environment variables for sensitive data (DB username/password, JWT secret, etc.)
# This file defines the default profile (local development).


spring:
  application:
    name: shopflow
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:shopflow}
    username: ${DB_USERNAME:shopflow_user}
    password: ${DB_PASSWORD:shopflow_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080