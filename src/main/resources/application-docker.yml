spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/shopflow
    username: ${POSTGRES_USER:shopflow_user}
    password: ${POSTGRES_PASSWORD:shopflow_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

server:
  port: 8080
