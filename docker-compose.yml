services:
  postgres:
    image: postgres:15-alpine
    container_name: shopflow-postgres
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow_user
      POSTGRES_PASSWORD: shopflow_password
    ports:
      - "55432:5432"
    volumes:
      - shopflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow_user -d shopflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  shopflow_pgdata: